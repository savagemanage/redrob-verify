[project]
name = "redrob-verify"
version = "0.1.0"
description = "Open evaluation harness for document OCR, forgery, face match, and identity APIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0,<5",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.9.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=12.3.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
forgery = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]
ocr = [
    "paddleocr[doc-parser]>=3.6.0,<4",
    "huggingface_hub>=0.26.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "services"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
