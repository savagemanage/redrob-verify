# Per-service dependency trees (never share a single venv across paddle/torch/opencv).
# Host harness talks to published ports on 127.0.0.1; in-network DNS is ocr/face/forgery/identity.

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OCR_URL: http://ocr:8001
      FACE_URL: http://face:8002
      FORGERY_URL: http://forgery:8003
      IDENTITY_URL: http://identity:8004
    depends_on:
      - ocr
      - face
      - forgery
      - identity

  ocr:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
      args:
        # Blackwell sm_120 (RTX 50 / RTX PRO 6000): use cu129. Older GPUs: cu126 + 3.2.1.
        PADDLE_INDEX: https://www.paddlepaddle.org.cn/packages/stable/cu129/
        PADDLE_PACKAGE: paddlepaddle-gpu==3.3.0
    ports:
      - "8001:8001"
    gpus: all
    volumes:
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./services/ocr:/app/services/ocr:ro
      - ./services/common:/app/services/common:ro
      - ocr_paddlex_cache:/root/.paddlex
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      FLAGS_use_cuda: "1"
  face:
    build:
      context: .
      dockerfile: services/face/Dockerfile
    ports:
      - "8002:8002"
    environment:
      FACE_BACKEND: sface
    volumes:
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models:ro

  forgery:
    build:
      context: .
      dockerfile: services/forgery/Dockerfile
      args:
        # Blackwell sm_120 needs cu128+ PyTorch (2.7.1). Older GPUs can override.
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
        TORCH_PACKAGE: torch==2.7.1
        TORCHVISION_PACKAGE: torchvision==0.22.1
    ports:
      - "8003:8003"
    gpus: all
    volumes:
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models:ro
      - ./services/forgery:/app/services/forgery:ro
      - ./services/common:/app/services/common:ro

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      IDENTITY_SOURCE_DELAY_SEC: ${IDENTITY_SOURCE_DELAY_SEC:-}

volumes:
  ocr_paddlex_cache:
